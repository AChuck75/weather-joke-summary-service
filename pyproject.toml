[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'assignment1-fastapi-service'
version = '1.0.0'
description = 'FastAPI weather, joke, and authenticated summary service'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = [
    'fastapi>=0.115,<1.0',
    'httpx>=0.27,<1.0',
    'pydantic-settings>=2.2,<3.0',
    'python-dotenv>=1.0,<2.0',
    'uvicorn>=0.27,<1.0',
]

[project.optional-dependencies]
dev = [
    'pytest>=8.0,<9.0',
]

[tool.setuptools.packages.find]
include = ['app*']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-q'
